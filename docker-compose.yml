version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: unnati_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unnati_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unnati_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
